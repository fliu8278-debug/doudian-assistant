name: Release Windows

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: Verify release configuration
        shell: pwsh
        run: |
          $tagVersion = $env:GITHUB_REF_NAME.Substring(1)
          $packageVersion = node -p "require('./package.json').version"
          if ($tagVersion -ne $packageVersion) {
            throw "Tag version $tagVersion does not match package version $packageVersion"
          }
      - name: Create draft release
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $lines = Get-Content CHANGELOG.md
          $start = [Array]::FindIndex([string[]]$lines, [Predicate[string]] { param($line) $line -eq "## [$version]" })
          if ($start -lt 0) { throw "Missing release notes for $version in CHANGELOG.md" }
          $end = $start + 1
          while ($end -lt $lines.Count -and $lines[$end] -notmatch '^## ') { $end++ }
          $lines[($start + 1)..($end - 1)] | Set-Content release-notes.md
          gh release create "$env:GITHUB_REF_NAME" --repo "$env:GITHUB_REPOSITORY" --draft --title "抖店助手 $env:GITHUB_REF_NAME" --notes-file release-notes.md
      - run: npm run release:win
      - name: Publish completed release
        shell: pwsh
        run: gh release edit "$env:GITHUB_REF_NAME" --repo "$env:GITHUB_REPOSITORY" --draft=false --latest
