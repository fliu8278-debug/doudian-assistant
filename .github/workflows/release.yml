name: Release Windows

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: Verify release configuration
        shell: pwsh
        run: |
          $missing = 'GH_TOKEN' | Where-Object {
            [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_))
          }
          if ($missing) { throw "Missing required release secrets: $($missing -join ', ')" }
          $tagVersion = $env:GITHUB_REF_NAME.Substring(1)
          $packageVersion = node -p "require('./package.json').version"
          if ($tagVersion -ne $packageVersion) {
            throw "Tag version $tagVersion does not match package version $packageVersion"
          }
      - name: Create draft release
        shell: pwsh
        run: gh release create "$env:GITHUB_REF_NAME" --repo fliu8278-debug/doudian-assistant-releases --draft --title "抖店助手 $env:GITHUB_REF_NAME" --generate-notes
      - run: npm run release:win
      - name: Publish completed release
        shell: pwsh
        run: gh release edit "$env:GITHUB_REF_NAME" --repo fliu8278-debug/doudian-assistant-releases --draft=false --latest
